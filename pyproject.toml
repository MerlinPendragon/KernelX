[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelx"
version = "0.1.0"
description = "Versioned Ascend profiling contracts and read-only environment evidence"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
kernelx = "kernelx.__main__:main"

[tool.setuptools.package-data]
kernelx = ["schemas/*.json"]

[tool.setuptools.packages.find]
include = ["kernelx*"]
